<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .parent{
            display: flex;
            
            background-color: black;
        }
        .child{
            margin:20px;
            
        }
        a{
            text-decoration: none;
            color: white;
            display: block;
            padding:10px 10px;
        }
        a:hover{
            background-color: grey;
            border-radius: 5px;
        }
        .card{
            display: flex;
            flex-direction: column;
            
        }
        .card img{
            width: 100%;
            
        }
        .parent2{
            background-color: white;
            display: flex;
            gap:10px;
            margin: 10px;
            justify-content: space-evenly;
            

        }
        .pic img{
            height: 200px;
            width: 200px;
            gap: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
          body{
            background-color: beige;
            color: aliceblue;
            
        }
       @media screen and (max-width:900px)  {
        body{
            background-color: darkkhaki;
        }
        @media screen and (max-width:700px) {
            body{
                background-color: coral;
                
            }
            
        }
       }
        
    




    </style>
</head>
<body>
    <div class ="parent">
    <div class="child"><a href="#">Home</a></div>
    <div class="child"><a href="#">Contact</a></div>
    <div class="child"><a href="#">About us</a></div>
    </div>

    <div class="card"><img src="images/stefan-vladimirov-Q_Moi2xjieU-unsplash.jpg"></div>

    <div class="parent2">
        <div class="pic"><img src="images/jay-wennington-N_Y88TWmGwA-unsplash.jpg" alt=""> <h3>ratatouille</h3> <p>supporting text</p></div><br>
        <div class="pic"><img src="images/morrow-solutions-e0-MjQe6fnA-unsplash.jpg" alt=""> <h3>violet lillies</h3> <p>supporting text</p> </div><br>
        <div class="pic"><img src="images/nadia-valko-0hAdietsUrE-unsplash.jpg" alt=""> <h3>cutlery</h3> <p>supporting text</p></div><br>




    </div>
    
    
</body>
</html>
