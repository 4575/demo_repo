<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>

    <script>
        var text = "";
        var array1= ["apple","banana","citrus","dates"];
        array1.reverse()
        array1.push("eggs")
        array1.pop()
        array1.shift()
        array1.unshift("pears","oranges")
        array1.sort()
        document.getElementById("demo1").innerHTML= array1
        len = array1.length
        let i=0
        for (i=0;i<len;i++){
            text += array1[i] + "<br>"
        }
        document.getElementById("demo2").innerHTML=text


        const animals=["dog","cat","owl"]
        const birds=["parrots","falcon"]
        animals[2]="lion";
        const preys = animals.concat(birds)
        document.getElementById("demo1").innerHTML=preys

        preys.splice(1,0,"fish");
        document.getElementById("demo3").innerHTML= preys
        //here 1 is position to insert, 0 is no of elements to remove while inserting from the prev position

        const newanimals= preys.slice(2)
        document.getElementById("demo4").innerHTML= newanimals

       

        
    </script>
</body>
</html>
