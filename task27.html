<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="" id="demo1" >
   
    <button onclick="check()">check</button>
   
    <input type="text" name="" id="demo4">

    

    <script>
        function check()
        {
            var a,text="";
            a= document.getElementById("demo1").value
            switch(a)
            {
                case "a":
                    text="apple";
                break;

                case "b":
                    text="banana";
                break;

                case "c":
                    text="citrus";
                break;

                default:
                    text="default"
                break;
            }
            document.getElementById("demo4").value = text
            
            

        }






    </script>
</body>
</html>
