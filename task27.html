<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="" id="demo1" >
    <input type="text" name="" id="demo2" >
    <button onclick="swap()">swap</button>
    <input type="text" name="" id="demo3">
    <input type="text" name="" id="demo4">

    

    <script>
        function swap()
        {
            var a,b 
            a= Number(document.getElementById("demo1").value)
            b=Number(document.getElementById("demo2").value)
            a=a+b
            b=a-b
            a=a-b
            document.getElementById("demo3").value = a
            document.getElementById("demo4").value = b
            
            

        }






    </script>
</body>
</html>
