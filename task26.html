<head>

</head>
<body>
    <input type="text" name="" id="demo1" >
    <input type="text" name="" id="demo2" >
    <button onclick="swap()">swap</button>
    <input type="text" name="" id="demo3">
    <input type="text" name="" id="demo4">

    

    <script>
        function swap()
        {
            var a,b,c,d
            a= document.getElementById("demo1").value
            b=document.getElementById("demo2").value
            c=b
            document.getElementById("demo3").value = c
            d=a
            document.getElementById("demo4").value=d

        }






    </script>
