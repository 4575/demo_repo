<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: white;
        }
        h2{
            color: goldenrod;

        }
        .navbar{
           padding: 10px;
            background-color: black;
           
        }
        ul{
               display: flex;
            justify-content: center;
              align-items: center;
                list-style: none;
               gap: 35px;
               flex-wrap: wrap;
              padding: 0 20px;
            
        }
        button{
            color: black;
            padding: 5px;
            background-color: goldenrod;
        }
        img{
            width: 100%;
            display: block;
            filter: brightness(50%);
        }
        .main{
            position: relative;
        }
        .content{
            position:absolute;
             top:20%;
            left:8%;
             width:90%;
             max-width:500px;
             
        }
        .last{
            display: flex;
            gap: 15px;
        }
        h1{
            margin: 20px;
        }
        

@media (max-width:768px){

    .navbar{
        padding:15px;
    }

    ul{
        flex-direction:column;
        gap:15px;
    }

    .content{
        top:12%;
        left:5%;
        width:90%;
    }

    h1{
        font-size:40px;
    }

    p{
        font-size:15px;
    }

    .last{
        flex-direction:column;
        width:220px;
    }

    button{
        width:100%;
        padding:12px;
    }
   

@media (max-width:992px){

    ul{
        gap:20px;
        font-size:15px;
    }

    h1{
        font-size:55px;
    }

    .content{
        top:18%;
        left:6%;
    }
    

}

}
     </style>
</head>
<body>
    
    <div class="navbar">
        <ul>
            <li><h2>LUXE</h2></li>
            <li><h2>LUXE1</h2></li>
            <li><h2>LUXE2</h2></li>
            <li >NEW IN</li>
            <LI>WOMEN</LI>
            <li>MEN</li>
            <li>ACCESSORIES</li>
            <LI>SALE</LI>
            <li><i class="fa-solid fa-magnifying-glass" style="color: rgb(116, 192, 252);"></i></li>
            <li><i class="fa-regular fa-heart"></i></li>
            <li  ><button>BAG(0)</button></li>
        </ul>
    </div>
    <div class="main">
        <img src="images/dress.avif" alt="">
        
    
    <div class="content">
        
        <button style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">SUMMER COLLECTION 2026</button>
        <h1 style="color: black;">Dress Your</h1> 
        <h1 style="color: goldenrod;">Story</h1>
        <p style="margin: 20px;">Effortless, comfortable, and chic dresses designed for the life you actually live.</p>
        <div class="last">
          <button>SHOP NOW</button>
            <button>VIEW LOOKBOOK</button>
        </div>

    </div>
    </div>
    <div class="footer">
        <p style="color: white; background-color: black; text-align: center;">copyright</p>
    </div>
    
</body>
</html>
